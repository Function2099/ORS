name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          archives: qtbase qttools qtsvg
          cache: true

      - name: Configure
        run: cmake -B ignore/build -S .

      - name: Build
        run: cmake --build ignore/build --config Release

      - name: Test
        run: ctest --test-dir ignore/build -C Release --output-on-failure
