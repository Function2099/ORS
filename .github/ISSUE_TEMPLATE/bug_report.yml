name: Bug report
description: Report a bug in ORS
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: ORS version
  - type: input
    id: os
    attributes:
      label: OS version
      placeholder: "Windows 11 23H2"
